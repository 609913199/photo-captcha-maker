<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="可上传图片、编辑提示语并设置正确答案的图片验证小工具" />
  <title>图片验证小工具</title>
  <style>
    :root{--blue:#1677ff;--blue2:#0b69e3;--ink:#132238;--muted:#748096;--line:#dbe3ef;--bg:#eef4fb;--ok:#13a465;--danger:#e95b62;--shadow:0 18px 50px rgba(31,59,96,.14)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 15% 0,#fff 0,transparent 34%),var(--bg);color:var(--ink);min-height:100vh}
    button,input,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:minmax(320px,420px) minmax(560px,760px);gap:34px;align-items:start;justify-content:center;padding:42px 28px}
    .panel,.captcha{background:#fff;border:1px solid rgba(178,195,218,.7);box-shadow:var(--shadow);border-radius:24px}.panel{padding:26px;position:sticky;top:28px}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--blue);font-weight:800}.panel h1{font-size:28px;margin:8px 0 8px}.sub{color:var(--muted);line-height:1.65;margin:0 0 24px;font-size:14px}.field{margin:17px 0}.field label,.upload-title{display:block;font-size:13px;font-weight:750;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;transition:.2s;background:#fbfdff}.field textarea{min-height:76px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,255,.12)}
    .uploadbox{border:1.5px dashed #a9bdd8;border-radius:15px;padding:18px;text-align:center;background:#f8fbff;position:relative}.uploadbox:hover{border-color:var(--blue)}.uploadbox input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}.uploadbox strong{display:block;font-size:14px}.uploadbox span{font-size:12px;color:var(--muted)}
    .filter-box{margin-top:18px;padding:15px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#fffaf1,#f6f1e9)}.filter-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.filter-head strong{font-size:14px}.filter-head span{font-size:11px;color:#9a7351;background:#f2e2ce;border-radius:99px;padding:4px 8px}.range-row{display:grid;grid-template-columns:88px 1fr 38px;gap:9px;align-items:center;margin:10px 0;font-size:12px}.range-row output{text-align:right;color:#8a684b;font-variant-numeric:tabular-nums}.range-row input{accent-color:#9f6a42;width:100%}
    .answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.answer-chip{position:relative;aspect-ratio:1;border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;background:#eaf0f7;cursor:pointer}.answer-chip img{width:100%;height:100%;object-fit:cover}.answer-chip.correct{border-color:var(--ok)}.answer-chip.correct:after{content:'✓';position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:white;font-weight:900;font-size:13px}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin-top:8px}.actions{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:750;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--blue);color:white;flex:1}.secondary{background:#edf3fa;color:#38516f}.ghost{background:transparent;color:var(--muted);padding-inline:8px}
    .preview-label{font-size:13px;color:#718097;margin:3px 0 10px 4px}.captcha{overflow:hidden}.cap-title{height:72px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:750;border-bottom:1px solid #edf1f6;position:relative}.cap-title:before{content:'';position:absolute;left:24px;width:10px;height:10px;border-left:2px solid #8190a4;border-bottom:2px solid #8190a4;transform:rotate(45deg)}
    .challenge{background:linear-gradient(135deg,var(--blue),#0d6fe9);color:white;padding:23px 28px 25px;position:relative;overflow:hidden}.challenge:after{content:'✦';position:absolute;right:28px;top:14px;font-size:52px;color:rgba(255,255,255,.22)}.challenge small{display:block;font-size:16px;opacity:.9;margin-bottom:8px}.challenge strong{display:block;font-size:28px;line-height:1.25}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#d6dee9}.tile{aspect-ratio:1;border:0;padding:0;background:#eef3f8;overflow:hidden;cursor:pointer;position:relative}.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:.22s}.tile:hover img{transform:scale(1.025)}.tile.selected:after{content:'✓';position:absolute;right:9px;top:9px;width:32px;height:32px;border-radius:50%;background:var(--blue);border:3px solid white;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;box-shadow:0 3px 12px rgba(0,0,0,.22)}.tile.selected:before{content:'';position:absolute;inset:0;border:4px solid var(--blue);z-index:1}
    .cap-footer{display:flex;align-items:center;padding:18px 20px;gap:8px}.iconbtn{border:0;background:transparent;color:#66758a;display:flex;align-items:center;gap:7px;padding:10px 12px;border-radius:10px;cursor:pointer}.iconbtn:hover{background:#f1f5fa}.savebtn{color:var(--blue);background:#edf5ff}.confirm{margin-left:auto;background:var(--blue);color:white;border:0;border-radius:10px;padding:13px 24px;font-weight:800;cursor:pointer}.empty{display:grid;place-items:center;aspect-ratio:3/2;color:#7d899b;background:linear-gradient(135deg,#f2f6fb,#e8eff8)}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);opacity:0;background:#172338;color:#fff;border-radius:999px;padding:12px 18px;box-shadow:0 12px 34px rgba(21,33,52,.3);transition:.25s;z-index:5;font-size:14px}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{background:var(--ok)}.toast.bad{background:var(--danger)}
    .save-modal{position:fixed;inset:0;background:rgba(12,22,38,.72);z-index:10;display:none;align-items:center;justify-content:center;padding:24px}.save-modal.show{display:flex}.save-card{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.save-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.save-head strong{font-size:18px}.close-save{border:0;background:#edf2f7;width:34px;height:34px;border-radius:50%;cursor:pointer}.result-img{display:block;width:100%;max-height:62vh;object-fit:contain;background:#edf2f7;border-radius:13px;border:1px solid var(--line)}.save-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.save-note{font-size:12px;color:var(--muted);text-align:center;margin:11px 0 0;line-height:1.55}
    @media(max-width:980px){.app{grid-template-columns:minmax(0,720px);padding:20px}.panel{position:static}.captcha-wrap{order:-1}.challenge strong{font-size:23px}}@media(max-width:560px){.app{padding:10px}.panel,.captcha{border-radius:16px}.panel{padding:20px}.cap-title{height:58px;font-size:20px}.challenge{padding:18px}.challenge strong{font-size:20px}.grid{gap:3px;padding:3px}.cap-footer{padding:12px 10px}.iconbtn span{display:none}.confirm{padding:11px 20px}}
  </style>
</head>
<body>
<main class="app">
  <section class="panel" aria-labelledby="editor-title">
    <div class="eyebrow">CAPTCHA MAKER</div>
    <h1 id="editor-title">制作你的图片验证</h1>
    <p class="sub">上传 2–9 张图片，编辑蓝框中的文字，再点选哪些图片属于正确答案。所有内容只在当前浏览器中处理。</p>
    <div class="field"><label for="titleInput">页面标题</label><input id="titleInput" maxlength="18" value="安全验证" /></div>
    <div class="field"><label for="prefixInput">蓝框引导语</label><input id="prefixInput" maxlength="28" value="请选择所有符合描述的图片" /></div>
    <div class="field"><label for="targetInput">蓝框重点文字</label><textarea id="targetInput" maxlength="48">唯一过生日的人</textarea></div>
    <div class="upload-title">验证图片</div>
    <div class="uploadbox"><input id="files" type="file" accept="image/*" multiple aria-label="选择图片" /><strong>＋ 选择图片</strong><span>支持 JPG、PNG、WebP，可一次多选</span></div>
    <div id="answers" class="answers" aria-label="设置正确答案"></div>
    <p class="hint">点击缩略图，将它标记为正确答案。再次点击可取消。</p>
    <div class="filter-box"><div class="filter-head"><strong>导出画风</strong><span>古早像素</span></div><label class="range-row" for="pixelInput"><span>像素块大小</span><input id="pixelInput" type="range" min="1" max="24" step="1" value="7"><output id="pixelValue">7</output></label><label class="range-row" for="blurInput"><span>模糊度</span><input id="blurInput" type="range" min="0" max="8" step="0.5" value="1.5"><output id="blurValue">1.5</output></label><label class="range-row" for="vintageInput"><span>古早褪色</span><input id="vintageInput" type="range" min="0" max="100" step="5" value="35"><output id="vintageValue">35%</output></label></div>
    <div class="actions"><button id="reset" class="btn ghost">恢复示例</button><button id="clear" class="btn secondary">清空图片</button><button id="apply" class="btn primary">更新预览</button></div>
  </section>
  <section class="captcha-wrap" aria-label="验证工具预览">
    <div class="preview-label">实时预览 · 点击图片可体验验证</div>
    <div class="captcha">
      <header id="capTitle" class="cap-title">安全验证</header>
      <div class="challenge"><small id="capPrefix">请选择所有符合描述的图片</small><strong id="capTarget">唯一过生日的人</strong></div>
      <div id="grid" class="grid"></div>
      <footer class="cap-footer"><button id="help" class="iconbtn" aria-label="帮助">◉ <span>不会</span></button><button id="shuffle" class="iconbtn" aria-label="换一组">↻ <span>换一组</span></button><button id="export" class="iconbtn savebtn" aria-label="生成并保存图片">⇩ <span>保存图片</span></button><button id="confirm" class="confirm">确定</button></footer>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="saveModal" class="save-modal" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
  <div class="save-card"><div class="save-head"><strong id="saveTitle">图片已生成</strong><button id="closeSave" class="close-save" aria-label="关闭">×</button></div><img id="resultImg" class="result-img" alt="生成的图片验证卡片" /><div class="save-actions"><button id="shareSave" class="btn primary">保存到相册</button><button id="downloadSave" class="btn secondary">下载 PNG</button></div><p class="save-note">iPhone / iPad：点“保存到相册”后，在系统菜单中选择“存储图像”。也可以长按上方图片保存。</p></div>
</div>
<script>
const $=s=>document.querySelector(s);let selected=new Set();let toastTimer;let exportedBlob=null;let exportedUrl='';
function svgData(label,color,accent,shape){const c=document.createElement('canvas');c.width=400;c.height=400;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,400,400);g.addColorStop(0,color);g.addColorStop(1,accent);x.fillStyle=g;x.fillRect(0,0,400,400);x.globalAlpha=.9;x.fillStyle='#fff';x.beginPath();x.arc(200,165,92,0,Math.PI*2);x.fill();x.globalAlpha=1;x.textAlign='center';x.textBaseline='middle';x.font='96px Apple Color Emoji,Segoe UI Emoji,sans-serif';x.fillText(shape,200,172);x.globalAlpha=.86;x.fillStyle='#fff';x.beginPath();x.roundRect(42,300,316,58,29);x.fill();x.globalAlpha=1;x.font='24px system-ui,sans-serif';x.fillStyle='#334155';x.fillText(label,200,330);return c.toDataURL('image/png')}
const samples=[['生日蛋糕','#fff0d8','#ffd0be','🎂',true],['庆祝派对','#e9f8ff','#cde1ff','🎉',true],['普通合照','#f2edff','#d7dbff','📷',false],['日落风景','#ffe4dc','#ffd49a','🌇',false],['生日帽子','#e8fff0','#c9eddd','🥳',true],['咖啡时间','#f4eadf','#d8c3ad','☕',false]];
let images=samples.map((x,i)=>({id:crypto.randomUUID?.()||'s'+i,src:svgData(x[0],x[1],x[2],x[3]),name:x[0],correct:x[4]}));
function renderAnswers(){const box=$('#answers');box.innerHTML='';images.forEach((im,i)=>{const b=document.createElement('button');b.className='answer-chip'+(im.correct?' correct':'');b.title=(im.correct?'取消正确答案：':'设为正确答案：')+im.name;b.innerHTML=`<img src="${im.src}" alt="${im.name}">`;b.onclick=()=>{im.correct=!im.correct;renderAnswers()};box.append(b)})}
function renderGrid(){const grid=$('#grid');grid.innerHTML='';selected.clear();if(!images.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">请在左侧上传图片</div>';return}images.forEach((im,i)=>{const b=document.createElement('button');b.className='tile';b.dataset.id=im.id;b.setAttribute('aria-label','选择图片 '+(i+1));b.innerHTML=`<img src="${im.src}" alt="验证图片 ${i+1}">`;b.onclick=()=>{selected.has(im.id)?selected.delete(im.id):selected.add(im.id);b.classList.toggle('selected')};grid.append(b)})}
function apply(){$('#capTitle').textContent=$('#titleInput').value.trim()||'安全验证';$('#capPrefix').textContent=$('#prefixInput').value.trim()||'请选择符合描述的图片';$('#capTarget').textContent=$('#targetInput').value.trim()||'目标图片';renderGrid();notice('预览已更新','ok')}
function notice(msg,type=''){const t=$('#toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',2200)}
$('#files').addEventListener('change',e=>{const files=[...e.target.files].slice(0,9);if(!files.length)return;Promise.all(files.map((f,i)=>new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve({id:crypto.randomUUID?.()||Date.now()+'-'+i,src:r.result,name:f.name,correct:false});r.readAsDataURL(f)}))).then(list=>{images=list;renderAnswers();renderGrid();notice(`已载入 ${list.length} 张图片`,'ok')});e.target.value=''})
$('#apply').onclick=apply;$('#clear').onclick=()=>{images=[];renderAnswers();renderGrid();notice('图片已清空')};$('#reset').onclick=()=>{images=samples.map((x,i)=>({id:crypto.randomUUID?.()||'r'+i,src:svgData(x[0],x[1],x[2],x[3]),name:x[0],correct:x[4]}));renderAnswers();apply()};
$('#shuffle').onclick=()=>{for(let i=images.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[images[i],images[j]]=[images[j],images[i]]}renderAnswers();renderGrid();notice('已换一组顺序')};
$('#help').onclick=()=>notice('提示：先读蓝框文字，再选中全部符合条件的图片');
$('#confirm').onclick=()=>{const right=new Set(images.filter(x=>x.correct).map(x=>x.id));if(!right.size){notice('请先在左侧设置正确答案','bad');return}const pass=selected.size===right.size&&[...right].every(id=>selected.has(id));notice(pass?'验证通过！你确实很会选。':'还差一点，请重新选择。',pass?'ok':'bad')};
function loadImg(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function cover(ctx,img,x,y,w,h){const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,s=Math.max(w/iw,h/ih),sw=w/s,sh=h/s,sx=(iw-sw)/2,sy=(ih-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=2){const chars=[...text];let line='',lines=[];for(const c of chars){const test=line+c;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=c}else line=test}if(line)lines.push(line);lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight))}
function drawRetroImage(ctx,img,x,y,w,h,block,blur,vintage){const size=Math.ceil(w),base=document.createElement('canvas');base.width=size;base.height=size;const bx=base.getContext('2d');bx.filter=`blur(${blur}px) sepia(${vintage*.006}) saturate(${Math.max(.55,1-vintage*.0035)}) contrast(${1+vintage*.0015})`;cover(bx,img,0,0,size,size);const small=document.createElement('canvas'),sw=Math.max(1,Math.round(size/block));small.width=sw;small.height=sw;const sx=small.getContext('2d');sx.imageSmoothingEnabled=true;sx.drawImage(base,0,0,sw,sw);ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(small,x,y,w,h);ctx.fillStyle=`rgba(170,105,55,${vintage*.0015})`;ctx.fillRect(x,y,w,h);ctx.restore()}
async function createExport(){if(!images.length){notice('请先上传图片','bad');return}notice('正在生成高清图片…');try{const loaded=[...document.querySelectorAll('#grid .tile img')];await Promise.all(loaded.map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve()));const block=+$(`#pixelInput`).value,blur=+$(`#blurInput`).value,vintage=+$(`#vintageInput`).value,cols=3,rows=Math.ceil(images.length/cols),W=1080,titleH=150,challengeH=230,gap=6,cell=(W-gap*(cols+1))/cols,footerH=150,H=Math.round(titleH+challengeH+gap+rows*(cell+gap)+footerH);const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#152238';ctx.font='700 52px system-ui,sans-serif';ctx.fillText($('#capTitle').textContent,W/2,titleH/2);ctx.fillStyle='#1677ff';ctx.fillRect(0,titleH,W,challengeH);ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='400 34px system-ui,sans-serif';ctx.fillText($('#capPrefix').textContent,58,titleH+66);ctx.fillStyle='#fff';ctx.font='700 58px system-ui,sans-serif';wrapText(ctx,$('#capTarget').textContent,58,titleH+145,W-116,68,2);ctx.textAlign='center';loaded.forEach((im,i)=>{const col=i%cols,row=Math.floor(i/cols),x=gap+col*(cell+gap),y=titleH+challengeH+gap+row*(cell+gap);drawRetroImage(ctx,im,x,y,cell,cell,block,blur,vintage)});const fy=H-footerH;ctx.fillStyle='#fff';ctx.fillRect(0,fy,W,footerH);ctx.fillStyle='#6e7b8e';ctx.font='400 34px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('◉  不会',48,fy+75);ctx.fillText('↻  换一组',245,fy+75);ctx.fillStyle='#1677ff';rounded(ctx,W-260,fy+32,210,86,16);ctx.fillStyle='#fff';ctx.font='700 38px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('确定',W-155,fy+75);if(vintage){ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgba(205,166,110,${vintage*.0011})`;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(73,46,30,${vintage*.00045})`;for(let y=0;y<H;y+=5)ctx.fillRect(0,y,W,1);ctx.restore()}exportedBlob=await new Promise(resolve=>c.toBlob(resolve,'image/png',1));if(exportedUrl)URL.revokeObjectURL(exportedUrl);exportedUrl=URL.createObjectURL(exportedBlob);$('#resultImg').src=exportedUrl;$('#saveModal').classList.add('show');notice('图片已生成','ok')}catch(e){notice('图片生成失败，请重试','bad')}}
$('#export').onclick=createExport;$('#closeSave').onclick=()=>$('#saveModal').classList.remove('show');$('#saveModal').onclick=e=>{if(e.target.id==='saveModal')$('#saveModal').classList.remove('show')};
$('#downloadSave').onclick=()=>{if(!exportedUrl)return;const a=document.createElement('a');a.href=exportedUrl;a.download='图片验证-'+new Date().toISOString().slice(0,10)+'.png';a.click();notice('PNG 已下载','ok')};
$('#shareSave').onclick=async()=>{if(!exportedBlob)return;const file=new File([exportedBlob],'图片验证.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:'图片验证'});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=exportedUrl;a.download='图片验证.png';a.click();notice('已下载；也可长按图片保存','ok')};
[['pixelInput','pixelValue',''],['blurInput','blurValue',''],['vintageInput','vintageValue','%']].forEach(([id,out,suffix])=>{$('#'+id).addEventListener('input',e=>$('#'+out).value=e.target.value+suffix)});
renderAnswers();renderGrid();
</script>
</body>
</html>
